services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./kafka_routing.yaml:/etc/blazingrail/kafka_routing.yaml:ro
    env_file: .env
    environment:
      - KAFKA_ROUTING_CONF_PATH=/etc/blazingrail/kafka_routing.yaml
      - RUST_LOG=api=info,pipeline=info,rdkafka=warn 
      - ENABLE_KAFKA=true
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 2s
      retries: 3
    network_mode: "host"             
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093 
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    network_mode: "host"              
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
